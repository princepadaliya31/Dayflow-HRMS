<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Computer Monitor Screen -->
  <rect x="10" y="32" width="80" height="52" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="4" />
  
  <!-- Monitor Stand -->
  <path d="M36,84 L64,84 L60,95 L40,95 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
  <line x1="20" y1="84" x2="80" y2="84" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- Gear (Yellow) sitting on top of screen -->
  <g stroke="#0f172a" stroke-width="3" stroke-linejoin="round">
    <!-- Teeth -->
    <rect x="47" y="6" width="6" height="32" rx="1.5" fill="#fde047" transform="rotate(0 50 22)" />
    <rect x="47" y="6" width="6" height="32" rx="1.5" fill="#fde047" transform="rotate(45 50 22)" />
    <rect x="47" y="6" width="6" height="32" rx="1.5" fill="#fde047" transform="rotate(90 50 22)" />
    <rect x="47" y="6" width="6" height="32" rx="1.5" fill="#fde047" transform="rotate(135 50 22)" />
    <!-- Center circle to blend teeth together -->
    <circle cx="50" cy="22" r="11" fill="#fde047" stroke="none" />
    <!-- Main gear outline circle -->
    <circle cx="50" cy="22" r="11" fill="none" />
    <!-- Gear center hole -->
    <circle cx="50" cy="22" r="4.5" fill="#f8fafc" />
  </g>

  <!-- Users inside the screen -->
  <!-- Left User (Red) -->
  <g>
    <path d="M22,79 C22,69 29,67 32,67 C35,67 42,69 42,79 Z" fill="#fca5a5" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
    <circle cx="32" cy="56" r="6.5" fill="#fca5a5" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- Right User (Green) -->
  <g>
    <path d="M58,79 C58,69 65,67 68,67 C71,67 78,69 78,79 Z" fill="#86efac" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
    <circle cx="68" cy="56" r="6.5" fill="#86efac" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- Center User (Blue) -->
  <g>
    <path d="M37,82 C37,70 45,68 50,68 C55,68 63,70 63,82 Z" fill="#93c5fd" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
    <circle cx="50" cy="58" r="8" fill="#93c5fd" stroke="#0f172a" stroke-width="3" />
  </g>
</svg>
